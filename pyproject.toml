[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minionerec-single-gpu"
version = "0.1.0"
description = "A single-A6000 reproduction of MiniOneRec"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
